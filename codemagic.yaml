workflows:
  neurocore-debug-apk:
    name: NeuroCore debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Use uploaded source zip (if present)
        script: |
          if [ -f NeuroCore-Mobile.zip ]; then
            rm -rf /tmp/src && mkdir /tmp/src
            unzip -q NeuroCore-Mobile.zip -d /tmp/src
            shopt -s dotglob
            cp -R /tmp/src/NeuroCore-Mobile/* .
            rm -f NeuroCore-Mobile.zip
          fi
          chmod +x gradlew scripts/setup.sh
      - name: Set up Android SDK, NDK and CMake
        script: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          echo "SDK location: $SDK"
          mkdir -p "$SDK"
          echo "sdk.dir=$SDK" > "$CM_BUILD_DIR/local.properties"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            for c in "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"; do
              if [ -x "$c" ]; then SDKM="$c"; break; fi
            done
          fi
          if [ -z "$SDKM" ]; then
            echo "sdkmanager not found, downloading Android command-line tools"
            curl -sL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
            rm -rf /tmp/cmdtools && mkdir /tmp/cmdtools
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$SDK" "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-35" "build-tools;34.0.0"
      - name: Fetch llama.cpp
        script: ./scripts/setup.sh
      - name: Build debug APK
        script: ./gradlew --no-daemon assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
